<!doctype html>
<html lang="{{ page_language|default('id') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rizal Portfolio administration login.">
    <title>{{ ui.login_heading }} | Rizal Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('shared.static', filename='shared/css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('shared.static', filename='shared/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin_web.static', filename='admin/css/app.css') }}">
  </head>
  <body class="auth-page">
    <a class="skip-link" href="#main-content">{{ ui.skip }}</a>
    <main id="main-content" class="auth-layout">
      <section class="auth-card" aria-labelledby="login-title">
        {% include "admin/_language_selector.html" %}

        <h1 id="login-title">{{ ui.login_heading }}</h1>
        <p>{{ ui.login_intro }}</p>

        {% if error %}
          <p class="form-message form-message-error" role="alert">{{ error }}</p>
        {% elif reason == 'session_expired' %}
          <p class="form-message" role="status">{{ ui.session_expired }}</p>
        {% endif %}

        <form class="auth-form" method="post" action="{{ url_for('auth_web.login_submit', lang=requested_language) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="lang" value="{{ requested_language }}">
          {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

          <label for="email">{{ ui.email }}</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="320" required>

          <label for="password">{{ ui.password }}</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>

          <button class="primary-button" type="submit">{{ ui.login }}</button>
        </form>
      </section>
    </main>
  </body>
</html>
