{% extends "shared/base.html" %}

{% block title %}{{ status_code }} | Rizal Portfolio{% endblock %}

{% block content %}
  <section aria-labelledby="error-title">
    <p class="eyebrow">{{ ui.error }} {{ status_code }}</p>
    <h1 id="error-title">{{ heading }}</h1>
    <p>{{ message }}</p>
    <p>{{ ui.request_id }}: <code>{{ request_id }}</code></p>
    <a href="{{ localized_url('public_web.home', requested_language) }}">{{ ui.back_home }}</a>
  </section>
{% endblock %}
