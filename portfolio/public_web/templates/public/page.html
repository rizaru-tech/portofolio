{% extends "shared/base.html" %}

{% block title %}{{ page.title }} | Rizal Portfolio{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('public_web.static', filename='public/css/app.css') }}">
{% endblock %}

{% block content %}
  <section class="page-introduction" aria-labelledby="page-title">
    <p class="eyebrow">Foundation milestone</p>
    <h1 id="page-title">{{ page.heading }}</h1>
    <p>{{ page.summary }}</p>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('public_web.static', filename='public/js/app.js') }}" defer></script>
{% endblock %}
